<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Phone Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            📱 Phone Store
        </a>

    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">
        Checkout
    </h2>

    <div class="row">

        <!-- Customer Details -->

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4>Shipping Details</h4>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Address
                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                required
                            ></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Payment Method
                            </label>

                            <select class="form-select">

                                <option>
                                    Cash On Delivery
                                </option>

                                <option>
                                    Credit Card
                                </option>

                                <option>
                                    Debit Card
                                </option>

                                <option>
                                    UPI
                                </option>

                            </select>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success btn-lg w-100"
                        >
                            Place Order
                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Order Summary -->

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h4>
                        Order Summary
                    </h4>

                    <hr>

                    {% for item in cart_items %}

                    <div class="d-flex justify-content-between mb-2">

                        <span>
                            {{ item.name }}
                        </span>

                        <span>
                            ₹{{ item.price }}
                        </span>

                    </div>

                    {% endfor %}

                    <hr>

                    <h3 class="text-success">

                        Total:
                        ₹{{ total }}

                    </h3>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">

    <p>
        © 2026 Phone Store
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
